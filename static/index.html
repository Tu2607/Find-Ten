<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find Ten</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- ====== WELCOME SCREEN ====== -->
  <section id="welcomeScreen" class="screen screen--welcome">
    <div class="chalkboard">
      <div class="chalkboard__surface">
        <div class="chalk-formulas" id="chalkFormulas" aria-hidden="true"></div>
        <div class="spotlight"></div>

        <div class="welcome-content">
          <div class="welcome-title" aria-label="Find Ten">
            <svg class="title-arc" viewBox="0 0 700 200" aria-hidden="true">
              <defs>
                <path id="arc" d="M 60,180 Q 350,10 640,180" fill="none"/>
                <filter id="chalkTitle" x="-5%" y="-5%" width="110%" height="110%">
                  <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise"/>
                  <feColorMatrix in="noise" type="saturate" values="0" result="grayNoise"/>
                  <feComposite in="SourceGraphic" in2="grayNoise" operator="in" result="chalky"/>
                  <feGaussianBlur in="chalky" stdDeviation="0.3"/>
                </filter>
              </defs>
              <g filter="url(#chalkTitle)">
                <text font-family="'Indie Flower', cursive" font-size="78" font-weight="900"
                      letter-spacing="10" stroke="white" stroke-width="6" stroke-linejoin="round"
                      fill="none" opacity="0.35">
                  <textPath href="#arc" startOffset="50%" text-anchor="middle">FIND TEN</textPath>
                </text>
                <text font-family="'Indie Flower', cursive" font-size="78" font-weight="900"
                      letter-spacing="10" fill="#ffe680">
                  <textPath href="#arc" startOffset="50%" text-anchor="middle">FIND TEN</textPath>
                </text>
              </g>
            </svg>
          </div>

          <p class="easter-egg" aria-hidden="true">9 + 10 = 21</p>

          <nav class="welcome-menu">
            <button type="button" class="chalk-btn" id="playButton">Play</button>
            <button type="button" class="chalk-btn" id="settingsButton">Settings</button>
            <button type="button" class="chalk-btn" id="leaderboardButton">Leaderboard</button>
          </nav>

        </div>
      </div>
      <div class="chalk-tray" aria-hidden="true"></div>
    </div>
  </section>

  <!-- ====== SETTINGS SCREEN ====== -->
  <section id="settingsScreen" class="screen screen--settings" hidden>
    <div class="chalkboard">
      <div class="chalkboard__surface">
        <h2 class="chalk-heading">Settings</h2>
        <div class="chalk-underline"></div>

        <div class="settings-grid">
          <div class="settings-group">
            <h3 class="chalk-label">Board Size</h3>
            <label class="chalk-radio">
              <input type="radio" name="boardSize" value="9" checked>
              <span>9 × 9</span>
            </label>
            <label class="chalk-radio">
              <input type="radio" name="boardSize" value="10">
              <span>10 × 10</span>
            </label>
            <label class="chalk-radio">
              <input type="radio" name="boardSize" value="11">
              <span>11 × 11</span>
            </label>
          </div>

          <div class="settings-group">
            <h3 class="chalk-label">Background</h3>
            <div class="color-swatches" role="group" aria-label="Board color">
              <button type="button" class="swatch swatch--green swatch--active" data-board-color="green" aria-label="Green" aria-pressed="true"></button>
              <button type="button" class="swatch swatch--blue" data-board-color="blue" aria-label="Blue" aria-pressed="false"></button>
              <button type="button" class="swatch swatch--red" data-board-color="red" aria-label="Red" aria-pressed="false"></button>
              <button type="button" class="swatch swatch--purple" data-board-color="purple" aria-label="Purple" aria-pressed="false"></button>
            </div>
          </div>

          <div class="settings-group">
            <h3 class="chalk-label">Font</h3>
            <label class="chalk-radio">
              <input type="radio" name="font" value="chalk" checked>
              <span class="font-preview font-preview--chalk">Chalk</span>
            </label>
            <label class="chalk-radio">
              <input type="radio" name="font" value="clean">
              <span class="font-preview font-preview--clean">Clean</span>
            </label>
            <label class="chalk-radio">
              <input type="radio" name="font" value="retro">
              <span class="font-preview font-preview--retro">Retro</span>
            </label>
          </div>

          <div class="settings-group">
            <h3 class="chalk-label">Timer</h3>
            <label class="chalk-radio">
              <input type="radio" name="timer" value="60">
              <span>60s</span>
            </label>
            <label class="chalk-radio">
              <input type="radio" name="timer" value="120" checked>
              <span>120s</span>
            </label>
            <label class="chalk-radio">
              <input type="radio" name="timer" value="180">
              <span>180s</span>
            </label>
          </div>
        </div>

        <button type="button" class="chalk-btn" id="settingsBackButton">← Back</button>
      </div>
      <div class="chalk-tray" aria-hidden="true"></div>
    </div>
  </section>

  <!-- ====== LEADERBOARD SCREEN ====== -->
  <section id="leaderboardScreen" class="screen screen--leaderboard" hidden>
    <div class="chalkboard">
      <div class="chalkboard__surface">
        <h2 class="chalk-heading">Leaderboard</h2>
        <div class="chalk-underline"></div>

        <div class="leaderboard-filters">
          <div class="leaderboard-filter-group">
            <span class="chalk-filter-label">Board</span>
            <div class="chalk-pill-group" data-filter="board">
              <button type="button" class="chalk-pill chalk-pill--active" data-value="all">All</button>
              <button type="button" class="chalk-pill" data-value="9">9 x 9</button>
              <button type="button" class="chalk-pill" data-value="10">10 x 10</button>
              <button type="button" class="chalk-pill" data-value="11">11 x 11</button>
            </div>
          </div>

          <div class="leaderboard-filter-group">
            <span class="chalk-filter-label">Time</span>
            <div class="chalk-pill-group" data-filter="timer">
              <button type="button" class="chalk-pill chalk-pill--active" data-value="all">All</button>
              <button type="button" class="chalk-pill" data-value="60">60s</button>
              <button type="button" class="chalk-pill" data-value="120">120s</button>
              <button type="button" class="chalk-pill" data-value="180">180s</button>
            </div>
          </div>
        </div>

        <div class="leaderboard-table-wrapper">
          <table class="leaderboard-table">
            <thead>
              <tr>
                <th>Rank</th>
                <th>Player</th>
                <th>Score</th>
                <th>Board</th>
                <th>Time</th>
              </tr>
            </thead>
            <tbody id="leaderboardBody"></tbody>
          </table>

          <p class="leaderboard-empty" id="leaderboardEmpty">No scores yet - play a game!</p>
        </div>

        <button type="button" class="chalk-btn" id="leaderboardBackButton">Back</button>
      </div>
      <div class="chalk-tray" aria-hidden="true"></div>
    </div>
  </section>

  <!-- ====== GAME SCREEN ====== -->
  <section id="gameScreen" class="screen screen--game" hidden>
    <div class="chalkboard">
      <div class="chalkboard__surface">
        <div class="game-topbar">
          <div class="topbar-score">
            <span class="topbar-label">Score</span>
            <strong id="scoreValue">0</strong>
          </div>
          <div class="topbar-time">
            <span class="topbar-label">Time</span>
            <strong id="timeValue">--</strong>
          </div>
          <div class="topbar-skills">
            <span class="topbar-label">Skills</span>
            <div class="skill-actions">
              <button id="reshuffleButton" class="chalk-btn chalk-btn--sm" type="button" disabled>Reshuffle</button>
              <button id="removeNumberButton" class="chalk-btn chalk-btn--sm" type="button" disabled>Remove</button>
              <button id="hintButton" class="chalk-btn chalk-btn--sm" type="button" disabled>Hint</button>
            </div>
          </div>
        </div>

        <div class="chalk-divider"></div>

        <section class="board-panel">
          <div id="board" class="board empty" aria-label="Game board"></div>
        </section>

        <div class="game-nav">
          <button type="button" class="chalk-btn chalk-btn--sm" id="restartButton">Restart</button>
          <button type="button" class="chalk-btn chalk-btn--sm" id="homeButton">Home</button>
        </div>
      </div>
      <div class="chalk-tray" aria-hidden="true"></div>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameOverOverlay" class="overlay" hidden>
      <div class="overlay__scrim"></div>
      <div class="overlay__popup">
        <h2 class="overlay__reason" id="gameOverReason">Time's Up!</h2>
        <div class="overlay__underline"></div>
        <p class="overlay__score-label">Final Score</p>
        <p class="overlay__score" id="gameOverScore">0</p>
        <div class="overlay__submit-area">
          <button type="button" class="chalk-btn" id="submitScoreOpenButton">Submit Score</button>
          <p class="overlay__submit-status" id="scoreSubmittedStatus" hidden>Score Submitted</p>
        </div>
        <div class="overlay__actions">
          <button type="button" class="chalk-btn" id="playAgainButton">Play Again</button>
          <button type="button" class="chalk-btn" id="mainMenuButton">Main Menu</button>
        </div>
      </div>
    </div>

    <!-- Score Submission Overlay -->
    <div id="scoreSubmissionOverlay" class="overlay" hidden>
      <div class="overlay__scrim"></div>
      <div class="overlay__popup overlay__popup--score-submit">
        <h2 class="overlay__reason">Submit Score</h2>
        <div class="overlay__underline"></div>
        <form id="scoreSubmissionForm" class="score-submit-form">
          <label class="score-submit-form__label" for="playerNameInput">Player Name</label>
          <input
            type="text"
            id="playerNameInput"
            class="score-submit-form__input"
            name="playerName"
            maxlength="10"
            autocomplete="name"
            placeholder="Your name"
          >
          <div class="overlay__actions overlay__actions--submit">
            <button type="submit" class="chalk-btn" id="submitScoreButton" disabled>Submit</button>
            <button type="button" class="chalk-btn" id="cancelScoreSubmitButton">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </section>

  <p id="errorToast" class="error-toast" hidden></p>
  <script src="/app.js"></script>
</body>
</html>
